<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda Web | Contacto</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-base="../" data-pagina="contacto">
  <div id="encabezado"></div>

  <main class="contenedor">
    <h1>Contáctanos</h1>
    <form id="form-contacto" class="formulario" action="#" method="post" novalidate>
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" autocomplete="name">
        <small class="error" id="error-nombre"></small>
      </div>
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" autocomplete="email">
        <small class="error" id="error-correo"></small>
      </div>
      <div class="campo">
        <label for="telefono">Celular</label>
        <input type="tel" id="telefono" name="telefono" placeholder="9XXXXXXXX">
        <small class="error" id="error-telefono"></small>
      </div>
      <div class="campo">
        <label for="asunto">Asunto</label>
        <select id="asunto" name="asunto">
          <option value="">Selecciona una opción</option>
          <option value="consulta">Consulta de producto</option>
          <option value="reclamo">Reclamo</option>
          <option value="sugerencia">Sugerencia</option>
        </select>
        <small class="error" id="error-asunto"></small>
      </div>
      <div class="campo">
        <label for="consulta">Mensaje</label>
        <textarea id="consulta" name="consulta" rows="5"></textarea>
        <small class="error" id="error-consulta"></small>
      </div>
      <button type="submit" class="boton">Enviar</button>
    </form>
    <div id="aviso" class="mensaje" role="status"></div>
  </main>

  <div id="pie"></div>

  <script src="../js/componentes.js"></script>
  <script src="../js/validacion.js"></script>
</body>
</html>
